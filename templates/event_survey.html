<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベントアンケート | CleanStep</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; background: #f4f7f6; color: #333; }
        .header { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; padding: 20px 64px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { max-width: 560px; margin: 22px auto; padding: 0 15px; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
        h1 { font-size: 21px; margin: 0 0 8px; color: #2c3e50; }
        .intro { color: #64716c; line-height: 1.7; font-size: 14px; }
        label { display: block; margin: 20px 0 8px; font-weight: bold; color: #34495e; }
        select, textarea { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #ccd6d2; border-radius: 8px; background: white; font: inherit; }
        textarea { min-height: 110px; resize: vertical; }
        .hint { font-size: 12px; color: #7f8c8d; margin-top: 5px; }
        .button { display: block; width: 100%; border: 0; border-radius: 28px; padding: 15px; margin-top: 20px; text-align: center; font-size: 16px; font-weight: bold; text-decoration: none; box-sizing: border-box; cursor: pointer; }
        .submit { background: linear-gradient(135deg, #2ecc71, #27ae60); color: white; }
        .skip { background: white; color: #65716c; border: 1px solid #d5dbdb; }
        @media (max-width: 480px) { .header { padding: 18px 60px; font-size: 18px; } .card { padding: 22px 18px; } }
    </style>
</head>
<body>
    {% include "_user_navigation.html" %}
    <div class="header">イベントアンケート</div>
    {% include "_user_page_back.html" %}
    <main class="container">
        <section class="card">
            <h1>{{ activity.event_name }}へのご参加ありがとうございました</h1>
            <p class="intro">次回のイベントをより参加しやすくするためのアンケートです。回答は任意で、参加ポイントには影響しません。回答内容は主催団体に共有して改善に活用します。自由記述に回答者名は表示されません。</p>
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="satisfaction">今回のイベントの満足度</label>
                <select id="satisfaction" name="satisfaction" required>
                    <option value="">選択してください</option>
                    <option value="5">5 とても満足</option>
                    <option value="4">4 満足</option>
                    <option value="3">3 ふつう</option>
                    <option value="2">2 やや不満</option>
                    <option value="1">1 不満</option>
                </select>

                <label for="time_fit">活動時間はどうでしたか？</label>
                <select id="time_fit" name="time_fit" required>
                    <option value="">選択してください</option>
                    <option value="short">短かった</option>
                    <option value="just_right">ちょうどよかった</option>
                    <option value="long">長かった</option>
                </select>

                <label for="next_participation">次回も参加したいですか？</label>
                <select id="next_participation" name="next_participation" required>
                    <option value="">選択してください</option>
                    <option value="yes">参加したい</option>
                    <option value="maybe">内容や日時によっては参加したい</option>
                    <option value="no">参加は難しい</option>
                </select>

                <label for="noticed_issue">🔍 活動中に気づいた地域の問題（任意）</label>
                <textarea id="noticed_issue" name="noticed_issue" maxlength="500" placeholder="例：ベンチ周辺に吸い殻やペットボトルが集中していた"></textarea>

                <label for="suspected_cause">💡 なぜその問題が発生していると思いますか？（任意）</label>
                <textarea id="suspected_cause" name="suspected_cause" maxlength="500" placeholder="例：自販機の横に回収ボックスがないため"></textarea>

                <label for="collaboration_note">🤝 他の参加者とどのように協力できましたか？（任意）</label>
                <textarea id="collaboration_note" name="collaboration_note" maxlength="500" placeholder="例：分別担当と回収担当に分かれて効率よく回れた"></textarea>

                <label for="next_improvement">🚀 次は何を改善したいですか？（任意）</label>
                <textarea id="next_improvement" name="next_improvement" maxlength="500" placeholder="例：次回はトングを増やし、重点エリアを先に回りたい"></textarea>

                <label for="comment">改善してほしい点（任意）</label>
                <textarea id="comment" name="comment" maxlength="500" placeholder="例：開始時間がもう少し遅いと参加しやすい"></textarea>
                <p class="hint">500文字以内。個人情報は入力しないでください。</p>

                <button class="button submit" type="submit">アンケートを送信</button>
            </form>
            <a class="button skip" href="{{ url_for('event_result', activity_id=activity.id) }}">回答せず戻る</a>
        </section>
    </main>
</body>
</html>
