<label for="event-map">地図上で開催場所を選択</label>
<p class="input-hint">開催場所欄の地名・施設名を検索して候補を選ぶか、地図をクリックしてピンを置いてください。ピンを置くと場所名と座標が自動入力されます。</p>
<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0;">
    <button id="event-location-search" type="button"
            style="padding:9px 14px; border:0; border-radius:6px; background:#257a52; color:#fff; font-weight:700; cursor:pointer;">
        開催場所の候補を検索
    </button>
    <span id="event-location-search-status" role="status" aria-live="polite"
          style="color:#475569; font-size:13px;"></span>
</div>
<div id="event-location-search-results" aria-label="場所の検索候補"></div>
<p class="input-hint">候補を選ぶと地図上に場所が表示されます。検索は「開催場所の候補を検索」ボタンを押したときだけ行われます。</p>
<div id="event-map" style="height:360px; width:100%; min-width:0; flex:1 1 100%; margin:12px 0; border:1px solid #dce5e1; border-radius:8px;"></div>
<p class="input-hint">緯度・経度の手入力は不要です。地図を使わない場合は空欄のまま保存できます。</p>
<div style="display:flex; gap:16px; flex-wrap:wrap;">
    <div style="flex:1 1 180px;">
        <label for="event-latitude">緯度</label>
        <input id="event-latitude" name="latitude" type="number" step="any" min="-90" max="90"
               value="{{ event.latitude if event.latitude is not none else '' }}">
    </div>
    <div style="flex:1 1 180px;">
        <label for="event-longitude">経度</label>
        <input id="event-longitude" name="longitude" type="number" step="any" min="-180" max="180"
               value="{{ event.longitude if event.longitude is not none else '' }}">
    </div>
</div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    (() => {
        const latitudeInput = document.getElementById('event-latitude');
        const longitudeInput = document.getElementById('event-longitude');
        const locationInput = document.getElementById('location');
        const searchButton = document.getElementById('event-location-search');
        const searchStatus = document.getElementById('event-location-search-status');
        const searchResults = document.getElementById('event-location-search-results');
        let lastSearchAt = 0;
        const map = L.map('event-map').setView([35.681236, 139.767125], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        let marker = null;
        let reverseRequest = 0;
        let reverseTimer = null;

        const setLocation = (latitude, longitude, zoom = 16) => {
            if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
            if (!marker) {
                marker = L.marker([latitude, longitude], { draggable: true }).addTo(map);
                marker.on('dragend', () => {
                    const point = marker.getLatLng();
                    latitudeInput.value = point.lat.toFixed(7);
                    longitudeInput.value = point.lng.toFixed(7);
                    reverseGeocode(point.lat, point.lng);
                });
            } else {
                marker.setLatLng([latitude, longitude]);
            }
            latitudeInput.value = latitude.toFixed(7);
            longitudeInput.value = longitude.toFixed(7);
            map.setView([latitude, longitude], zoom);
        };

        const reverseGeocode = (latitude, longitude) => {
            const requestId = ++reverseRequest;
            clearTimeout(reverseTimer);
            reverseTimer = setTimeout(async () => {
                try {
                    const params = new URLSearchParams({
                        lat: latitude.toString(),
                        lon: longitude.toString(),
                        format: 'jsonv2',
                        'accept-language': 'ja'
                    });
                    const response = await fetch(
                        `https://nominatim.openstreetmap.org/reverse?${params}`,
                        {
                            headers: { Accept: 'application/json' },
                            referrerPolicy: 'strict-origin-when-cross-origin'
                        }
                    );
                    if (!response.ok) {
                        throw new Error(`場所名の取得に失敗しました (HTTP ${response.status})`);
                    }
                    const place = await response.json();
                    if (requestId === reverseRequest && place.display_name) {
                        locationInput.value = place.display_name;
                        searchStatus.textContent = 'ピンの場所名を開催場所に入力しました。';
                    }
                } catch (error) {
                    console.error(error);
                    if (requestId === reverseRequest) {
                        searchStatus.textContent = '場所名を取得できませんでした。開催場所を手入力してください。';
                    }
                }
            }, 1100);
        };

        if (latitudeInput.value && longitudeInput.value) {
            setLocation(Number(latitudeInput.value), Number(longitudeInput.value));
        }
        map.on('click', event => {
            setLocation(event.latlng.lat, event.latlng.lng);
            reverseGeocode(event.latlng.lat, event.latlng.lng);
        });
        const syncInputs = () => {
            if (!latitudeInput.value || !longitudeInput.value) return;
            const latitude = Number(latitudeInput.value);
            const longitude = Number(longitudeInput.value);
            if (latitude >= -90 && latitude <= 90 &&
                longitude >= -180 && longitude <= 180) {
                setLocation(latitude, longitude);
            }
        };
        latitudeInput.addEventListener('change', syncInputs);
        longitudeInput.addEventListener('change', syncInputs);

        searchButton.addEventListener('click', async () => {
            const query = locationInput.value.trim();
            searchResults.replaceChildren();
            if (!query) {
                searchStatus.textContent = '開催場所欄に地名や施設名を入力してください。';
                return;
            }
            const now = Date.now();
            if (now - lastSearchAt < 1100) {
                searchStatus.textContent = '続けて検索する場合は少し待ってください。';
                return;
            }

            searchButton.disabled = true;
            lastSearchAt = now;
            searchStatus.textContent = '場所を検索しています…';
            try {
                const params = new URLSearchParams({
                    q: query,
                    format: 'jsonv2',
                    limit: '5',
                    'accept-language': 'ja'
                });
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?${params}`,
                    {
                        headers: { Accept: 'application/json' },
                        referrerPolicy: 'strict-origin-when-cross-origin'
                    }
                );
                if (!response.ok) {
                    throw new Error(`場所検索に失敗しました (HTTP ${response.status})`);
                }
                const places = await response.json();
                if (!Array.isArray(places) || places.length === 0) {
                    searchStatus.textContent = '候補が見つかりません。短い施設名や住所を試すか、地図をクリックしてピンを置いてください。';
                    return;
                }

                const list = document.createElement('ul');
                list.style.cssText = 'padding-left:20px; margin:8px 0;';
                places.forEach(place => {
                    const latitude = Number(place.lat);
                    const longitude = Number(place.lon);
                    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;

                    const item = document.createElement('li');
                    item.style.marginBottom = '6px';
                    const resultButton = document.createElement('button');
                    resultButton.type = 'button';
                    resultButton.textContent = place.display_name;
                    resultButton.style.cssText = 'padding:6px 9px; border:1px solid #cbd5e1; border-radius:5px; background:#fff; color:#1f2937; text-align:left; cursor:pointer;';
                    resultButton.addEventListener('click', () => {
                        setLocation(latitude, longitude, 17);
                        locationInput.value = place.display_name;
                        searchStatus.textContent = `候補を選択しました（緯度 ${latitude.toFixed(7)}、経度 ${longitude.toFixed(7)}）。`;
                        searchResults.replaceChildren();
                    });
                    item.append(resultButton);
                    list.append(item);
                });
                if (list.childElementCount === 0) {
                    searchStatus.textContent = '有効な座標の候補がありません。地図をクリックしてピンを置いてください。';
                } else {
                    searchStatus.textContent = '候補を選択すると、地図のピンと緯度・経度欄に反映されます。';
                    searchResults.append(list);
                }
            } catch (error) {
                searchStatus.textContent = '場所検索に失敗しました。地図をクリックしてピンを置いてください。';
                console.error(error);
            } finally {
                searchButton.disabled = false;
            }
        });
        setTimeout(() => map.invalidateSize(), 100);
    })();
</script>
