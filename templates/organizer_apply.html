<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>イベント主催者の申請 | CleanStep</title>
    <style>
        body { margin: 0; padding: 60px 16px 24px; background: #f4f7f6; color: #263238; font-family: "Yu Gothic", Meiryo, sans-serif; }
        main { max-width: 640px; margin: 0 auto; padding: 28px; background: #fff; border: 1px solid #dce5e1; border-radius: 8px; }
        h1 { margin-top: 0; font-size: 1.4rem; }
        p { line-height: 1.7; }
        label { display: block; margin: 18px 0 6px; font-weight: 700; }
        input, textarea { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #bac8c2; border-radius: 5px; font: inherit; }
        textarea { min-height: 120px; resize: vertical; }
        button, .link { display: inline-block; margin-top: 18px; padding: 11px 16px; border: 0; border-radius: 5px; background: #257a52; color: #fff; font-weight: 700; text-decoration: none; cursor: pointer; }
        .notice { padding: 14px; background: #eef6f1; border-left: 4px solid #257a52; }
        .error { color: #a32626; }
    </style>
</head>
<body>
    {% include "_user_navigation.html" %}
<main>
    <h1>団体申請の審査状況</h1>
    <p class="notice">団体利用の申請を受け付けています。管理者の審査結果をお待ちください。</p>
    <p><a href="{{ url_for('home') }}">メニューに戻る</a></p>
</main>
</body>
</html>
