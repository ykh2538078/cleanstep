<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>通知 | CleanStep</title>
    <style>
        body { margin: 0; background: #f4f7f6; color: #263238; font-family: "Yu Gothic", Meiryo, sans-serif; }
        main { max-width: 760px; margin: 24px auto; padding: 60px 16px 32px; }
        .heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .heading h1 { font-size: 1.5rem; }
        .notification { margin: 12px 0; overflow: hidden; background: #fff; border: 1px solid #dce5e1; border-radius: 10px; }
        .notification.unread { border-left: 5px solid #257a52; background: #f8fcf9; }
        .notification-open-form { margin: 0; }
        .notification-open-button { display: block; width: 100%; padding: 18px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
        .notification-open-button:hover { background: #f4f8f5; }
        .notification-open-title { display: block; margin-bottom: 8px; font-size: 1.05rem; font-weight: 700; }
        .notification-open-message { display: block; line-height: 1.7; white-space: pre-line; }
        .notification-actions { display: flex; justify-content: flex-end; padding: 0 18px 12px; }
        .notification-read-btn { padding: 6px 12px; border: 1px solid #257a52; border-radius: 6px; background: #fff; color: #257a52; font: inherit; font-size: .82rem; font-weight: 700; cursor: pointer; }
        .notification-read-btn:hover { background: #eef7f1; }
        time { display: block; margin-top: 10px; color: #64748b; font-size: .85rem; }
        .heading button { padding: 9px 12px; border: 0; border-radius: 6px; background: #257a52; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
        .empty { padding: 24px; background: #fff; border-radius: 10px; color: #596a63; }
        @media (max-width: 520px) { .heading { align-items: flex-start; flex-direction: column; } }
    </style>
</head>
<body>
    {% include "_user_navigation.html" %}
    <main>
        <div class="heading">
            <h1>通知</h1>
            {% if unread_notification_count %}
                <form method="POST" action="{{ url_for('mark_all_notifications_read') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit">すべて既読にする</button>
                </form>
            {% endif %}
        </div>
        {% for notification in notifications %}
            <article class="notification {{ 'unread' if not notification.is_read }}">
                <form class="notification-open-form" method="POST" action="{{ url_for('open_notification', notification_id=notification.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button class="notification-open-button" type="submit" aria-label="{{ notification.title }}を開く">
                        <span class="notification-open-title">{{ notification.title }}</span>
                        <span class="notification-open-message">{{ notification.message }}</span>
                        <time>{{ notification.created_at|jst_datetime }}</time>
                    </button>
                </form>
                {% if not notification.is_read %}
                <div class="notification-actions">
                    <form method="POST" action="{{ url_for('mark_notification_read', notification_id=notification.id) }}" style="margin:0;">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button class="notification-read-btn" type="submit">既読にする</button>
                    </form>
                </div>
                {% endif %}
            </article>
        {% else %}
            <p class="empty">まだ通知はありません。</p>
        {% endfor %}
    </main>
</body>
</html>
