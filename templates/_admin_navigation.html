<style>
    .admin-app-bar { position: fixed; top: 10px; right: 12px; z-index: 1000; display: flex; align-items: flex-start; gap: 8px; }
    .admin-menu-toggle { width: 42px; height: 42px; border: 1px solid rgba(44,62,80,.2); border-radius: 8px; background: rgba(255,255,255,.96); color: #2c3e50; font-size: 23px; cursor: pointer; }
    .admin-app-logout { display: inline-flex; min-height: 42px; box-sizing: border-box; align-items: center; padding: 0 12px; border: 1px solid rgba(44,62,80,.2); border-radius: 8px; background: rgba(255,255,255,.96); color: #a32626; text-decoration: none; font-size: 13px; font-weight: 700; }
    .admin-menu-panel { position: fixed; inset: 0 auto 0 0; z-index: 1002; width: min(340px, 88vw); overflow-y: auto; padding: 22px 18px; background: #fff; box-shadow: 4px 0 18px rgba(0,0,0,.18); transform: translateX(-105%); transition: transform .2s ease; }
    .admin-menu-panel[aria-hidden="false"] { transform: translateX(0); }
    .admin-menu-heading { display: block; margin: 4px 8px 5px; color: #64748b; font-size: 12px; font-weight: 800; letter-spacing: .04em; }
    .admin-menu-panel nav { display: grid; gap: 6px; margin: 18px 0; }
    .admin-menu-panel nav a { padding: 11px 12px; border-radius: 8px; background: #f3f8f5; color: #17633f; text-decoration: none; font-weight: 700; }
    .admin-menu-panel nav a:hover, .admin-menu-panel nav a[aria-current="page"] { background: #e1f1e8; }
    .admin-menu-backdrop { position: fixed; inset: 0; z-index: 1001; border: 0; background: rgba(15,23,42,.35); }
    .admin-menu-backdrop[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { .admin-menu-panel { transition: none; } }
</style>
<div class="admin-app-bar">
    <button class="admin-menu-toggle" type="button" aria-label="管理者メニューを開く" aria-expanded="false" aria-controls="admin-menu-panel">☰</button>
    <a class="admin-app-logout" href="{{ url_for('logout') }}">ログアウト</a>
</div>
<button class="admin-menu-backdrop" type="button" aria-label="管理者メニューを閉じる" hidden></button>
<aside class="admin-menu-panel" id="admin-menu-panel" aria-hidden="true" aria-label="管理者メニュー">
    <strong>管理者メニュー</strong>
    <nav aria-label="運営トップ">
        <span class="admin-menu-heading">運営</span>
        <a href="{{ url_for('admin_dashboard') }}" {% if request.endpoint == 'admin_dashboard' %}aria-current="page"{% endif %}>ダッシュボード</a>
        <a href="{{ url_for('admin_organizer_applications') }}" {% if request.endpoint in ['admin_organizer_applications', 'review_organizer_application'] %}aria-current="page"{% endif %}>団体申請の審査</a>
        <a href="{{ url_for('admin_event_reviews') }}" {% if request.endpoint in ['admin_event_reviews', 'review_event'] %}aria-current="page"{% endif %}>イベント審査</a>
        <a href="{{ url_for('admin_feedback') }}" {% if request.endpoint == 'admin_feedback' %}aria-current="page"{% endif %}>アンケート・感想</a>
        <a href="{{ url_for('admin_events') }}" {% if request.endpoint in ['admin_events', 'admin_event_add', 'admin_event_edit', 'admin_event_location'] %}aria-current="page"{% endif %}>イベント管理</a>
        <a href="{{ url_for('admin_users') }}" {% if request.endpoint in ['admin_users', 'admin_user_login_destination'] %}aria-current="page"{% endif %}>ユーザー管理</a>
    </nav>
    <nav aria-label="活動・システム管理">
        <span class="admin-menu-heading">活動・システム</span>
        <a href="{{ url_for('admin_activity_report') }}" {% if request.endpoint == 'admin_activity_report' %}aria-current="page"{% endif %}>活動実績レポート</a>
        <a href="{{ url_for('admin_activity_verifications') }}" {% if request.endpoint in ['admin_activity_verifications', 'update_activity_verification'] %}aria-current="page"{% endif %}>活動データの確認</a>
        <a href="{{ url_for('admin_ai_logs') }}" {% if request.endpoint in ['admin_ai_logs', 'admin_ai_log_detail'] %}aria-current="page"{% endif %}>AI判定ログ</a>
        <a href="{{ url_for('admin_ai_flags') }}" {% if request.endpoint == 'admin_ai_flags' %}aria-current="page"{% endif %}>要確認ログ</a>
        <a href="{{ url_for('admin_bins') }}" {% if request.endpoint in ['admin_bins', 'add_bin', 'edit_bin', 'delete_bin'] %}aria-current="page"{% endif %}>ごみ箱設置場所</a>
        <a href="{{ url_for('admin_rewards') }}" {% if request.endpoint in ['admin_rewards', 'add_reward', 'edit_reward'] %}aria-current="page"{% endif %}>特典管理</a>
    </nav>
</aside>
<script>
    (() => {
        const toggle = document.querySelector('.admin-menu-toggle');
        const panel = document.getElementById('admin-menu-panel');
        const backdrop = document.querySelector('.admin-menu-backdrop');
        if (!toggle || !panel || !backdrop) return;
        const close = () => {
            panel.setAttribute('aria-hidden', 'true');
            toggle.setAttribute('aria-expanded', 'false');
            backdrop.hidden = true;
        };
        toggle.addEventListener('click', () => {
            const isOpen = panel.getAttribute('aria-hidden') === 'false';
            panel.setAttribute('aria-hidden', String(isOpen));
            toggle.setAttribute('aria-expanded', String(!isOpen));
            backdrop.hidden = isOpen;
        });
        backdrop.addEventListener('click', close);
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') close();
        });
    })();
</script>
