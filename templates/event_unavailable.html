<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント予約不可 - CleanStep</title>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        .hero-banner {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .hero-banner h1 {
            margin: 0;
            font-size: 32px;
        }

        .hero-banner a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            text-align: center;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 15px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        p {
            color: #566573;
            line-height: 1.6;
        }

        .button-group {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            min-width: 160px;
        }

        .btn-home {
            background: #2ecc71;
            color: white;
        }

        .btn-home:hover {
            background: #27ae60;
        }

        .btn-events {
            background: #3498db;
            color: white;
        }

        .btn-events:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>

<div class="hero-banner">
    <h1>
        <a href="{{ url_for('home') }}">CleanStep</a>
    </h1>
    <p>イベント予約</p>
</div>

<div class="container">
    <div class="card">
        <div class="icon">⏰</div>

        <h2>イベント予約不可</h2>

        <p>
            このイベントはすでに開催日時を過ぎています。<br>
            開催済みのイベントは予約できません。
        </p>

        <div class="button-group">
            <a href="{{ url_for('home') }}" class="btn btn-home">
                ホームへ戻る
            </a>

            <a href="{{ url_for('all_events') }}" class="btn btn-events">
                イベント一覧を見る
            </a>
        </div>
    </div>
</div>

</body>
</html>
