<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | CleanStep</title>
    <style>
        body { margin: 0; padding: 24px; background: #f4f7f6; color: #263238; font-family: "Yu Gothic", Meiryo, sans-serif; }
        main { max-width: 640px; margin: 12vh auto 0; padding: 28px; border: 1px solid #dce5e1; border-radius: 12px; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,.06); }
        h1 { margin-top: 0; font-size: 1.4rem; }
        p { line-height: 1.7; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
        .actions a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 16px; border-radius: 8px; background: #257a52; color: #fff; font-weight: 700; text-decoration: none; }
        .actions a.secondary { border: 1px solid #b8d8c8; background: #f3f8f5; color: #17633f; }
        @media (max-width: 480px) { body { padding: 14px; } main { margin-top: 8vh; padding: 22px 18px; } .actions a { flex: 1 1 100%; } }
    </style>
</head>
<body>
    <main>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <div class="actions">
            <a class="secondary" href="{{ url_for('home') }}" data-history-back>前の画面に戻る</a>
            <a href="{{ url_for('home') }}">ホームへ</a>
        </div>
    </main>
    <script>
        document.querySelectorAll('[data-history-back]').forEach(link => {
            link.addEventListener('click', event => {
                if (window.history.length < 2 || !document.referrer) return;
                try {
                    if (new URL(document.referrer).origin === window.location.origin) {
                        event.preventDefault();
                        window.history.back();
                    }
                } catch {
                    // Keep the home link as a safe fallback.
                }
            });
        });
    </script>
</body>
</html>
