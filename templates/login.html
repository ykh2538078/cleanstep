<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#28a745">
    <title>CleanStep - ログイン</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 50px 20px; background-color: #f4f7f6; text-align: center; color: #333; }
        .container { width: 100%; max-width: 400px; box-sizing: border-box; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #2ecc71; margin-bottom: 10px; font-size: 28px; }
        h2 { font-size: 16px; color: #7f8c8d; margin-bottom: 30px; font-weight: normal; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input[type="email"], input[type="password"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .password-field { display: flex; gap: 8px; }
        .password-field input { flex: 1; min-width: 0; }
        .toggle-password { width: auto; flex: 0 0 auto; margin: 0; padding: 0 12px; background: #e8f2ec; color: #246b48; font-size: 14px; }
        .toggle-password:hover { background: #dcebe2; }
        button { width: 100%; min-height: 44px; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
        button:hover { background-color: #27ae60; }
        .error { color: #e74c3c; background-color: #fce4d6; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; text-align: left; border-left: 4px solid #e74c3c; }
        .link { margin-top: 25px; font-size: 14px; }
        .link a { color: #3498db; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
        .submit-status { min-height: 20px; margin: 10px 0 0; color: #566573; font-size: 14px; }
        @media (max-width: 480px) {
            body { padding: 24px 16px; }
            .container { padding: 28px 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CleanStep</h1>
        <h2>ログインしてごみ拾いを始めましょう</h2>
        
        <!-- 🔑 Python側からエラーが返ってきたらここに表示されます -->
        {% if error_msg %}
            <div class="error">{{ error_msg }}</div>
        {% endif %}

        <!-- 🔑 app.pyのlogin関数にデータをPOST送信するフォーム（ここが最重要！） -->
        <form action="{{ url_for('login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" required placeholder="example@example.com" autocomplete="username" value="{{ email }}">
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" required placeholder="パスワードを入力" autocomplete="current-password">
                    <button type="button" class="toggle-password" aria-controls="password" aria-pressed="false">表示</button>
                </div>
            </div>
            <button type="submit">ログイン</button>
            <p class="submit-status" id="submit-status" role="status" aria-live="polite"></p>
        </form>

        <div class="link">
            <a href="{{ url_for('register') }}">新規ユーザー登録はこちら</a>
        </div>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', () => {
            const status = document.getElementById('submit-status');
            status.textContent = '送信しています…';
            window.setTimeout(() => {
                status.textContent = '応答がありません。接続を確認して、もう一度お試しください。';
            }, 10000);
        });
        document.querySelectorAll('.toggle-password').forEach((button) => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.getAttribute('aria-controls'));
                const visible = input.type === 'password';
                input.type = visible ? 'text' : 'password';
                button.textContent = visible ? '隠す' : '表示';
                button.setAttribute('aria-pressed', String(visible));
            });
        });
    </script>
    <script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/static/sw.js")
        .then(() => console.log("SW registered"));
}
</script>
</body>
</html>
