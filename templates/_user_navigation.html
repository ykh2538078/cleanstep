<style>
    .user-app-bar { position: fixed; inset: 0 0 auto; z-index: 1000; display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 12px; pointer-events: none; }
    .user-app-bar a, .user-menu-toggle { pointer-events: auto; }
    .user-menu-toggle { width: 42px; height: 42px; border: 1px solid rgba(44,62,80,.2); border-radius: 8px; background: rgba(255,255,255,.92); color: #2c3e50; font-size: 23px; cursor: pointer; }
    .user-app-logout { display: inline-flex; min-height: 42px; box-sizing: border-box; align-items: center; padding: 0 12px; border-radius: 8px; background: rgba(255,255,255,.92); color: #a32626; text-decoration: none; font-size: 13px; font-weight: 700; }
    .user-menu-panel { position: fixed; inset: 0 auto 0 0; z-index: 1002; width: min(320px, 85vw); padding: 20px; background: #fff; box-shadow: 4px 0 18px rgba(0,0,0,.18); transform: translateX(-105%); transition: transform .2s ease; }
    .user-menu-panel[aria-hidden="false"] { transform: translateX(0); }
    .user-menu-panel nav { display: grid; gap: 8px; margin-top: 20px; }
    .user-menu-panel nav a { padding: 12px; border-radius: 8px; background: #f3f8f5; color: #17633f; text-decoration: none; font-weight: 700; }
    .user-menu-backdrop { position: fixed; inset: 0; z-index: 1001; border: 0; background: rgba(15,23,42,.35); }
    .user-menu-backdrop[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) { .user-menu-panel { transition: none; } }
</style>
<div class="user-app-bar">
    <button class="user-menu-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="user-menu-panel">☰</button>
    <a class="user-app-logout" href="{{ url_for('logout') }}">ログアウト</a>
</div>
<button class="user-menu-backdrop" type="button" aria-label="メニューを閉じる" hidden></button>
<aside class="user-menu-panel" id="user-menu-panel" aria-hidden="true" aria-label="ユーザーメニュー">
    <strong>メニュー</strong>
    <nav>
        <a href="{{ url_for('home') }}">ホーム</a>
        <a href="{{ url_for('mypage') }}">マイページ・カレンダー・実績</a>
        <a href="{{ url_for('all_events') }}">イベント一覧</a>
        <a href="{{ url_for('my_reservations') }}">予約したイベント</a>
        <a href="{{ url_for('trash_bin') }}">ごみ回収・AI判定</a>
        <a href="{{ url_for('exchange_page') }}">特典交換</a>
        <a href="{{ url_for('organizer_dashboard') }}">団体向けメニュー</a>
    </nav>
</aside>
<script>
    (() => {
        const toggle = document.querySelector('.user-menu-toggle');
        const panel = document.getElementById('user-menu-panel');
        const backdrop = document.querySelector('.user-menu-backdrop');
        const close = () => {
            panel.setAttribute('aria-hidden', 'true');
            toggle.setAttribute('aria-expanded', 'false');
            backdrop.hidden = true;
        };
        toggle.addEventListener('click', () => {
            const isOpen = panel.getAttribute('aria-hidden') === 'false';
            panel.setAttribute('aria-hidden', String(isOpen));
            toggle.setAttribute('aria-expanded', String(!isOpen));
            backdrop.hidden = isOpen;
        });
        backdrop.addEventListener('click', close);
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') close();
        });
    })();
</script>
