<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント作成 - CleanStep</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 50px 20px; background-color: #f4f7f6; text-align: center; }
        .container { width: 100%; max-width: 400px; box-sizing: border-box; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        fieldset { margin: 0 0 18px; padding: 0; border: 0; text-align: left; }
        legend { margin-bottom: 8px; font-weight: bold; }
        .account-type-options { display: grid; gap: 8px; }
        .account-choice { display: flex; align-items: flex-start; gap: 9px; padding: 12px; border: 1px solid #d5dfd9; border-radius: 7px; cursor: pointer; }
        .account-choice input { margin-top: 3px; }
        .account-choice span { display: grid; gap: 3px; }
        .account-choice small, .hint { color: #596a63; line-height: 1.5; }
        .organization-fields { margin: 0 0 18px; padding: 14px; border: 1px solid #d5dfd9; border-radius: 7px; background: #f8fbf9; text-align: left; }
        .organization-fields[hidden] { display: none; }
        input[type="text"], input[type="email"], input[type="password"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font: inherit; font-size: 16px; }
        .password-field { display: flex; gap: 8px; }
        .password-field input { flex: 1; min-width: 0; }
        .toggle-password { width: auto; flex: 0 0 auto; padding: 0 12px; background: #e8f2ec; color: #246b48; font-size: 14px; }
        .toggle-password:hover { background: #dcebe2; }
        button { width: 100%; min-height: 44px; padding: 10px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #27ae60; }
        .error { color: red; margin-bottom: 15px; }
        .link { margin-top: 15px; font-size: 14px; }
        .submit-status { min-height: 20px; margin: 10px 0 0; color: #566573; font-size: 14px; }
        @media (max-width: 480px) {
            body { padding: 24px 16px; }
            .container { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>アカウント作成</h2>
        
        {% if error_msg %}
            <p class="error">{{ error_msg }}</p>
        {% endif %}

        <form action="{{ url_for('register') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="name">お名前</label>
                <input type="text" id="name" name="name" required maxlength="80" placeholder="エコ 太郎" value="{{ name }}">
            </div>
            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" required maxlength="254" placeholder="example@example.com" autocomplete="username" value="{{ email }}">
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" required minlength="8" maxlength="128" placeholder="8文字以上" autocomplete="new-password">
                    <button type="button" class="toggle-password" aria-controls="password" aria-pressed="false">表示</button>
                </div>
            </div>
            <fieldset>
                <legend>利用方法</legend>
                <div class="account-type-options">
                    <label class="account-choice">
                        <input type="radio" name="account_type" value="individual" {% if account_type != 'organization' %}checked{% endif %}>
                        <span><strong>個人として利用</strong><small>イベント参加や活動記録に利用します。</small></span>
                    </label>
                    <label class="account-choice">
                        <input type="radio" name="account_type" value="organization" {% if account_type == 'organization' %}checked{% endif %}>
                        <span><strong>団体の代表者として申請</strong><small>アカウントはすぐ作成され、団体機能は管理者の承認後に利用できます。</small></span>
                    </label>
                </div>
            </fieldset>
            <section class="organization-fields" id="organization-fields" {% if account_type != 'organization' %}hidden{% endif %} aria-labelledby="organization-fields-title">
                <h3 id="organization-fields-title">団体申請の情報</h3>
                <p class="hint">申請内容は管理者が確認します。承認前は個人ユーザーとして利用できます。</p>
                <div class="form-group">
                    <label for="organization_name">団体名</label>
                    <input type="text" id="organization_name" name="organization_name" maxlength="100" value="{{ organization_name }}">
                </div>
                <div class="form-group">
                    <label for="organization_contact">団体の連絡先</label>
                    <input type="text" id="organization_contact" name="organization_contact" maxlength="200" placeholder="メールアドレスまたは電話番号" value="{{ organization_contact }}">
                </div>
                <div class="form-group" style="margin-bottom:0;">
                    <label for="organization_purpose">活動内容・主催予定のイベント</label>
                    <textarea id="organization_purpose" name="organization_purpose" maxlength="1000" rows="4">{{ organization_purpose }}</textarea>
                </div>
            </section>
            <button type="submit">アカウント作成</button>
            <p class="submit-status" id="submit-status" role="status" aria-live="polite"></p>
        </form>

        <div class="link">
            <a href="{{ url_for('login') }}">既にアカウントをお持ちの方はこちら（ログイン）</a>
        </div>
    </div>
    <script>
        const registerForm = document.querySelector('form');
        const organizationFields = document.getElementById('organization-fields');
        const organizationInputs = organizationFields.querySelectorAll('input, textarea');
        const updateAccountTypeFields = () => {
            const isOrganization = document.querySelector('input[name="account_type"]:checked').value === 'organization';
            organizationFields.hidden = !isOrganization;
            organizationInputs.forEach(input => { input.required = isOrganization; });
        };
        document.querySelectorAll('input[name="account_type"]').forEach(input => {
            input.addEventListener('change', updateAccountTypeFields);
        });
        updateAccountTypeFields();

        registerForm.addEventListener('submit', () => {
            const status = document.getElementById('submit-status');
            status.textContent = '送信しています…';
            window.setTimeout(() => {
                status.textContent = '応答がありません。接続を確認して、もう一度お試しください。';
            }, 10000);
        });
        document.querySelectorAll('.toggle-password').forEach((button) => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.getAttribute('aria-controls'));
                const visible = input.type === 'password';
                input.type = visible ? 'text' : 'password';
                button.textContent = visible ? '隠す' : '表示';
                button.setAttribute('aria-pressed', String(visible));
            });
        });
    </script>
</body>
</html>
