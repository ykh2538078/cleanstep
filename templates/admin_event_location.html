<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanStep - イベント位置設定</title>
    <style>
        body { margin: 0; padding: 24px 16px; background: #f4f7f6; color: #263238; font-family: "Yu Gothic", Meiryo, sans-serif; }
        main { max-width: 750px; margin: 24px auto; padding: 28px; background: #fff; border: 1px solid #dce5e1; border-radius: 8px; }
        h1 { margin-top: 0; font-size: 1.4rem; }
        label { display: block; margin: 18px 0 6px; font-weight: 700; }
        input { box-sizing: border-box; width: 100%; padding: 11px; border: 1px solid #bac8c2; border-radius: 5px; font: inherit; }
        .place-name { margin: 6px 0 14px; }
        .hint { color: #64748b; font-size: 13px; }
        .error { color: #a32626; }
        button { margin-top: 16px; padding: 11px 16px; border: 0; border-radius: 5px; background: #257a52; color: #fff; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    {% include "_admin_navigation.html" %}
<main>
    <h1>イベントの地図ピン設定</h1>
    <p><strong>{{ event.name }}</strong></p>
    <p class="hint">この画面では地図上の位置だけを更新します。イベント内容や予約・参加記録は変更されません。</p>
    {% if error_msg %}<p class="error" role="alert">{{ error_msg }}</p>{% endif %}
    <form method="POST" action="{{ url_for('admin_event_location', event_id=event.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="location">場所名（検索用）</label>
        <input class="place-name" id="location" type="text" value="{{ event.location }}" readonly>
        {% include "_event_location_picker.html" %}
        <button type="submit">この位置を保存</button>
    </form>
    <p><a href="{{ url_for('admin_events') }}">イベント一覧に戻る</a></p>
</main>
</body>
</html>
